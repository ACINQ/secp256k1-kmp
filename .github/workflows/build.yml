name: Build

# Reusable workflow that builds and tests the library on all supported platforms, and optionally
# publishes the artifacts to the local maven repository and uploads them.
# It is called by test.yml, snapshot.yml and release.yml: do not add triggers here.

on:
  workflow_call:
    inputs:
      channel:
        description: 'Publication channel (`release` or `snapshot`). When left empty, we only build and test: nothing is published or uploaded.'
        type: string
        default: ''
      gradleArgs:
        description: 'Extra arguments passed to the gradle publication tasks.'
        type: string
        default: ''

jobs:

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            nativeTestTask: linuxX64Test
          - os: macOS-latest
            label: macos
            nativeTestTask: iosX64Test
          - os: windows-latest
            label: windows
            # native targets are not built on windows
            nativeTestTask: ''
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Enable KVM
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install cross compiler
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Cached Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Android environment
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> $GITHUB_ENV
      - name: Cached Android NDK
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/ndk/{1}', env.ANDROID_HOME, env.ANDROID_NDK_VERSION) }}
          key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}
      - name: Set up shell
        if: matrix.os == 'windows-latest'
        run: |
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rm.exe "C:/WINDOWS/system32/bash.EXE"
      - name: Install Automake
        if: matrix.os == 'macOS-latest'
        run: brew install automake libtool
      - name: Install Automake (windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          path-type: minimal
          update: true
          install: >-
            base-devel
            autotools
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
      - name: Setup Android
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;$ANDROID_NDK_VERSION"
      - name: Skip Android (windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          echo "skip.android=true" > local.properties
      - name: Skip Android (macos)
        if: matrix.os == 'macOS-latest'
        run: |
          echo "skip.android=true" > local.properties
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Check JVM
        if: matrix.os != 'windows-latest'
        run: ./gradlew jvmTest
      - name: Check JVM (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: ./gradlew jvmTest
      - name: Check native
        if: matrix.nativeTestTask != ''
        shell: bash
        run: ./gradlew ${{ matrix.nativeTestTask }}
      - name: Check Android
        if: matrix.os == 'ubuntu-latest'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          disk-size: 5GB
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          ndk: ${{ env.ANDROID_NDK_VERSION }}
          cmake: 3.31.5
          script: ./gradlew connectedCheck
      - name: Publish Linux
        if: inputs.channel != '' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew publishAndroidPublicationToMavenLocal publishLinuxArm64PublicationToMavenLocal publishLinuxX64PublicationToMavenLocal :jni:jvm:linux:publishJvmPublicationToMavenLocal ${{ inputs.gradleArgs }}
      - name: Publish Windows
        if: inputs.channel != '' && matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: ./gradlew :jni:jvm:mingw:publishToMavenLocal ${{ inputs.gradleArgs }}
      - name: Publish MacOS
        if: inputs.channel != '' && matrix.os == 'macOS-latest'
        shell: bash
        run: ./gradlew publishToMavenLocal ${{ inputs.gradleArgs }}
      - name: Copy artifact files
        if: inputs.channel != ''
        run: |
          mkdir -p maven-local/${{ inputs.channel }}
          cp -r ~/.m2/repository/* maven-local/${{ inputs.channel }}
      - name: Upload artifacts
        if: inputs.channel != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.channel }}-${{ matrix.label }}
          path: |
            maven-local
            !maven-local/**/maven-metadata-local.xml
